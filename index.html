<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rạp Đánh Giá</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Firebase (compat build) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root{
    --bg:#ffffff;
    --ink:#1c1a1e;
    --muted:#84808a;
    --line:#ececee;
    --surface:#faf9fb;
    --accent:#7a2048;
    --accent-ink:#ffffff;
    --accent-soft:#f5e6ec;
    --gold:#b8863f;
    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:8px;
    --shadow:0 1px 2px rgba(28,26,30,.04), 0 8px 24px rgba(28,26,30,.06);
  }
  *{box-sizing:border-box;}
  html{-webkit-font-smoothing:antialiased;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    font-size:17px;line-height:1.5;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}

  .wrap{max-width:1180px;margin:0 auto;padding:0 28px;}

  /* ---------- Top bar ---------- */
  .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .topbar-inner{display:flex;align-items:center;gap:20px;padding:16px 28px;max-width:1180px;margin:0 auto;flex-wrap:wrap;}
  .brand{font-family:'Fraunces',serif;font-size:22px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;}
  .brand span{color:var(--accent);}
  .search-shell{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 18px;transition:border-color .15s ease;}
  .search-shell:focus-within{border-color:var(--accent);}
  .search-shell input{border:0;background:transparent;outline:none;font-size:16px;width:100%;color:var(--ink);font-family:inherit;}
  .search-shell input::placeholder{color:var(--muted);}
  .icon{width:18px;height:18px;flex:none;stroke:var(--muted);}
  .btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 20px;font-size:15px;font-weight:600;transition:background .15s ease,border-color .15s ease;white-space:nowrap;}
  .btn:hover{background:var(--surface);border-color:#d8d5db;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{background:#611936;}
  .btn.ghost{border-color:transparent;background:transparent;}
  .navlinks{display:flex;gap:8px;align-items:center;}

  /* ---------- Filter ---------- */
  .filter-wrap{position:relative;}
  .filter-panel{position:absolute;right:0;top:calc(100% + 10px);background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius-md);padding:16px;width:320px;max-height:80vh;overflow-y:auto;display:none;z-index:40;}
  .filter-panel.open{display:block;}
  .filter-panel h4{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:600;text-transform:none;}
  .chip-row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .chip{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);border:1px solid transparent;font-size:15px;transition:background .12s ease;}
  .chip:hover{background:var(--surface);}
  .chip.active{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent);font-weight:600;}
  .chip input{accent-color:var(--accent);width:16px;height:16px;}
  .filter-actions{display:flex;justify-content:flex-end;}

  /* ---------- Page header ---------- */
  .page-head{padding:36px 0 22px;}
  .page-head h1{font-size:32px;margin:0 0 6px;font-weight:600;}
  .page-head p{margin:0;color:var(--muted);font-size:16px;}
  .result-count{color:var(--muted);font-size:15px;margin:0 0 18px;}

  /* ---------- Grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;padding-bottom:40px;}
  @media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:620px){.grid{grid-template-columns:1fr;}}

  .card{border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;background:#fff;display:flex;flex-direction:column;transition:box-shadow .18s ease,transform .18s ease;}
  .card:hover{box-shadow:var(--shadow);transform:translateY(-2px);}
  .card-media{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--surface);}
  .card-media img{width:100%;height:100%;object-fit:cover;display:block;}
  .score-badge{position:absolute;top:12px;left:12px;background:rgba(28,26,30,.78);color:#fff;border-radius:999px;padding:7px 13px;font-family:'Fraunces',serif;font-weight:600;font-size:17px;backdrop-filter:blur(4px);}
  .score-badge small{font-family:'Inter';font-size:11px;font-weight:600;opacity:.7;margin-left:2px;}
  .card-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px;flex:1;}
  .card-title{font-family:'Fraunces',serif;font-size:19px;font-weight:600;line-height:1.3;margin:0;}
  .crit-list{display:flex;flex-direction:column;gap:6px;}
  .crit-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);}
  .crit-row .label{width:84px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .crit-bar{flex:1;height:5px;border-radius:99px;background:var(--surface);overflow:hidden;}
  .crit-bar i{display:block;height:100%;background:var(--accent);border-radius:99px;}
  .crit-val{width:26px;text-align:right;font-weight:600;color:var(--ink);}
  .actor-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px;border-top:1px solid var(--line);}
  .actor-chip{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--surface);font-size:13px;font-weight:600;transition:background .12s ease;}
  .actor-chip:hover{background:var(--accent-soft);color:var(--accent);}
  .actor-chip img{width:24px;height:24px;border-radius:50%;object-fit:cover;background:#eee;}

  /* ---------- Pagination ---------- */
  .pager{display:flex;justify-content:center;align-items:center;gap:14px;padding:10px 0 60px;}
  .pager button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:600;}
  .pager button:disabled{opacity:.35;cursor:default;}
  .pager button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .pager .dots{color:var(--muted);}

  /* ---------- Empty / loading ---------- */
  .empty{padding:80px 20px;text-align:center;color:var(--muted);}
  .empty h3{color:var(--ink);margin-bottom:6px;}

  /* ---------- Detail: review ---------- */
  .detail-review{display:grid;grid-template-columns:minmax(280px,440px) 1fr;gap:48px;padding:36px 0 70px;align-items:start;}
  @media (max-width:800px){.detail-review{grid-template-columns:1fr;}}
  .detail-img{border-radius:var(--radius-lg);overflow:hidden;background:var(--surface);border:1px solid var(--line);}
  .detail-img img{width:100%;display:block;}
  .detail-title{font-size:34px;margin:0 0 12px;font-weight:600;}
  .detail-actors{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px;}
  .big-score{display:flex;align-items:baseline;gap:10px;margin-bottom:28px;}
  .big-score .num{font-family:'Fraunces',serif;font-size:56px;font-weight:600;color:var(--accent);line-height:1;}
  .big-score .cap{color:var(--muted);font-size:15px;}
  .crit-detail{display:flex;flex-direction:column;gap:16px;}
  .crit-detail-row{}
  .crit-detail-row .top{display:flex;justify-content:space-between;margin-bottom:6px;font-size:15px;}
  .crit-detail-row .top b{font-weight:700;}
  .crit-detail-bar{height:8px;border-radius:99px;background:var(--surface);overflow:hidden;}
  .crit-detail-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:99px;}
  .note{font-size:13px;color:var(--muted);margin-top:22px;line-height:1.6;}

  /* ---------- Detail: actor ---------- */
  .actor-head{display:flex;align-items:center;gap:22px;padding:44px 0 30px;}
  .actor-head img{width:96px;height:96px;border-radius:50%;object-fit:cover;background:var(--surface);border:1px solid var(--line);}
  .actor-head h1{margin:0 0 6px;font-size:30px;}
  .actor-head .sub{color:var(--muted);}

  /* ---------- Forms (admin/settings) ---------- */
  .form-shell{max-width:640px;margin:0 auto;padding:40px 0 80px;}
  .tabs{display:flex;gap:8px;margin-bottom:26px;border-bottom:1px solid var(--line);}
  .tab{padding:10px 4px;margin-right:20px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;}
  .tab.active{color:var(--ink);border-color:var(--accent);}
  label{display:block;font-size:14px;font-weight:600;margin:18px 0 6px;}
  input[type=text],input[type=url],input[type=number],textarea{
    width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-sm);
    font-family:inherit;font-size:16px;background:var(--surface);outline:none;transition:border-color .15s ease;
  }
  input:focus,textarea:focus{border-color:var(--accent);background:#fff;}
  textarea{min-height:110px;resize:vertical;}
  .slider-row{display:flex;align-items:center;gap:14px;}
  input[type=range]{flex:1;accent-color:var(--accent);}
  .slider-val{width:42px;text-align:right;font-weight:700;font-family:'Fraunces',serif;font-size:18px;}
  .actor-pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .pick-chip{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;}
  .pick-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .form-actions{margin-top:30px;display:flex;gap:10px;}
  .banner{background:var(--accent-soft);color:var(--accent);padding:12px 16px;border-radius:var(--radius-sm);font-size:14px;margin-bottom:18px;}
  .hint{color:var(--muted);font-size:13px;margin-top:4px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const CRITERIA = ["Ngoại hình","Kỹ năng","Cảm xúc","Đa dạng","Chất lượng hình ảnh"];
const PAGE_SIZE = 12;

// Collections are namespaced so this app never touches other data living
// in the same Firebase project.
const COLL_ACTORS = 'revapp_actors';
const COLL_REVIEWS = 'revapp_reviews';

// Pre-filled with the project you gave me. You can still change it any
// time from the "Cài đặt" page — nothing here is hardcoded elsewhere.
const DEFAULT_FIREBASE_CONFIG = {
  apiKey: "AIzaSyA2lLlNu_oxHD53815oXQAFAjfsGIFXOtc",
  authDomain: "tutaikhoan-721be.firebaseapp.com",
  databaseURL: "https://tutaikhoan-721be-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "tutaikhoan-721be",
  storageBucket: "tutaikhoan-721be.firebasestorage.app",
  messagingSenderId: "351249191890",
  appId: "1:351249191890:web:c7c94023dbdc1108092e0b",
  measurementId: "G-K1FE8PYDZW"
};

let firebaseApp = null, db = null;
let actors = [];      // {id,name,avatarUrl}
let reviews = [];      // {id,title,imageUrl,actorIds[],scores{},createdAt}
let dataReady = false;
let loadError = null;

let state = {
  search: "",
  sort: "newest",      // newest | crit1 | overall | actorscore
  page: 1,
  filterOpen: false,
  adminTab: "actor",
  filterActorIds: [],  // multi-select actor filter
  critMin: {},         // {criterion: minScore} — only kept if > 0
  overallMin: 0,
};
CRITERIA.forEach(c=> state.critMin[c] = 0 );

function hasActiveFilters(){
  return state.filterActorIds.length>0 || state.overallMin>0 || CRITERIA.some(c=>state.critMin[c]>0);
}
function resetFilters(){
  state.filterActorIds = [];
  state.overallMin = 0;
  CRITERIA.forEach(c=> state.critMin[c] = 0 );
}

function friendlyError(err){
  if(err && err.code === 'permission-denied'){
    return 'Không có quyền đọc/ghi Firestore.\n\nVào Firebase Console → Firestore Database → Rules, và thêm rule cho 2 collection app này dùng:\n\nmatch /'+COLL_ACTORS+'/{doc} { allow read, write: if true; }\nmatch /'+COLL_REVIEWS+'/{doc} { allow read, write: if true; }\n\n(hoặc bật test mode). Sau khi Publish rule, tải lại trang.';
  }
  return 'Lỗi: '+(err && err.message ? err.message : err);
}

/* ============================================================
   FIREBASE INIT
   ============================================================ */
function loadConfig(){
  try{
    const saved = JSON.parse(localStorage.getItem('fbConfig')||'null');
    if(saved) return saved;
  }catch(e){}
  if(DEFAULT_FIREBASE_CONFIG){ saveConfig(DEFAULT_FIREBASE_CONFIG); return DEFAULT_FIREBASE_CONFIG; }
  return null;
}
function saveConfig(cfg){ localStorage.setItem('fbConfig', JSON.stringify(cfg)); }

function initFirebase(){
  const cfg = loadConfig();
  if(!cfg) return false;
  try{
    if(!firebaseApp){
      firebaseApp = firebase.initializeApp(cfg);
      db = firebase.firestore();
      attachListeners();
    }
    return true;
  }catch(e){
    console.error(e);
    return false;
  }
}

function attachListeners(){
  db.collection(COLL_ACTORS).onSnapshot(snap=>{
    actors = snap.docs.map(d=>({id:d.id,...d.data()}));
    dataReady = true;
    render();
  }, err=>{ console.error(err); dataReady=true; loadError = friendlyError(err); render(); });
  db.collection(COLL_REVIEWS).onSnapshot(snap=>{
    reviews = snap.docs.map(d=>({id:d.id,...d.data()}));
    dataReady = true;
    render();
  }, err=>{ console.error(err); dataReady=true; loadError = friendlyError(err); render(); });
}

/* ============================================================
   IRL SCORING
   rarity weight: criteria where the population average is high
   (everyone scores well) contribute less; criteria where the
   average is low (rare to score well) contribute more.
   ============================================================ */
function rarityWeight(avg){
  const w = 1 - (avg/100);
  return Math.max(w, 0.12);
}

function popAverages(list, getScore){
  const sums = {}, counts = {};
  CRITERIA.forEach(c=>{sums[c]=0;counts[c]=0;});
  list.forEach(item=>{
    const s = getScore(item);
    CRITERIA.forEach(c=>{
      const v = s[c];
      if(typeof v === 'number'){ sums[c]+=v; counts[c]++; }
    });
  });
  const avg = {};
  CRITERIA.forEach(c=> avg[c] = counts[c] ? sums[c]/counts[c] : 50 );
  return avg;
}

function weightedScore(scores, avgs){
  let sw=0, sws=0;
  CRITERIA.forEach(c=>{
    const w = rarityWeight(avgs[c]);
    sw += w;
    sws += w * (scores[c]||0);
  });
  return sw ? (sws/sw) : 0;
}

function computeReviewScores(){
  const avgs = popAverages(reviews, r=>r.scores||{});
  const map = {};
  reviews.forEach(r=>{
    map[r.id] = { overall: weightedScore(r.scores||{}, avgs), perCrit: avgs };
  });
  return map;
}

function computeActorScores(){
  // per-actor per-criterion average across their reviews
  const actorCritAvg = {};
  actors.forEach(a=>{
    const vids = reviews.filter(r=>(r.actorIds||[]).includes(a.id));
    const sums={},counts={};
    CRITERIA.forEach(c=>{sums[c]=0;counts[c]=0;});
    vids.forEach(v=>{
      CRITERIA.forEach(c=>{
        const val=(v.scores||{})[c];
        if(typeof val==='number'){sums[c]+=val;counts[c]++;}
      });
    });
    const avg={};
    CRITERIA.forEach(c=> avg[c] = counts[c]? sums[c]/counts[c] : 0 );
    actorCritAvg[a.id] = { avg, count: vids.length };
  });
  const popAvg = {};
  CRITERIA.forEach(c=>{
    const vals = actors.map(a=>actorCritAvg[a.id].avg[c]).filter(v=>v>0);
    popAvg[c] = vals.length ? vals.reduce((x,y)=>x+y,0)/vals.length : 50;
  });
  const result = {};
  actors.forEach(a=>{
    result[a.id] = weightedScore(actorCritAvg[a.id].avg, popAvg);
  });
  return result;
}

/* ============================================================
   HELPERS
   ============================================================ */
function normalize(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function actorById(id){ return actors.find(a=>a.id===id); }
function fmt(n){ return Math.round(n); }
function esc(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }

function icon(name){
  const icons = {
    search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
    filter:'<path d="M4 6h16M7 12h10M10 18h4"/>',
    back:'<path d="M19 12H5M12 19l-7-7 7-7"/>',
  };
  return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icons[name]||''}</svg>`;
}

/* ============================================================
   ROUTER
   ============================================================ */
window.addEventListener('hashchange', ()=>{ state.page=1; state.filterOpen=false; render(); });
window.addEventListener('DOMContentLoaded', ()=>{
  if(initFirebase()){ render(); } else { render(); }
});

function go(hash){ location.hash = hash; }

/* ============================================================
   RENDER: SHELL
   ============================================================ */
function render(){
  const cfg = loadConfig();
  if(!cfg){ document.getElementById('app').innerHTML = topbar()+settingsPage(true); bindGlobal(); return; }
  if(!firebaseApp) initFirebase();

  const hash = location.hash || '#/';
  let body = '';
  if(hash === '#/' || hash === ''){ body = homePage(); }
  else if(hash.startsWith('#/review/')){ body = reviewPage(hash.split('/')[2]); }
  else if(hash.startsWith('#/actor/')){ body = actorPage(hash.split('/')[2]); }
  else if(hash === '#/admin'){ body = adminPage(); }
  else if(hash === '#/settings'){ body = settingsPage(false); }
  else { body = homePage(); }

  document.getElementById('app').innerHTML = topbar() + `<div class="wrap">${body}</div>`;
  bindGlobal();
}

function topbar(){
  return `
  <div class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/">Rạp <span>Đánh Giá</span></a>
      <div class="search-shell">
        ${icon('search')}
        <input id="searchInput" type="text" placeholder="Tìm tên diễn viên hoặc tiêu đề video…" value="${esc(state.search)}">
      </div>
      <div class="filter-wrap">
        <button class="btn" id="filterToggle">${icon('filter')} Lọc${hasActiveFilters()?` · ${state.filterActorIds.length + (state.overallMin>0?1:0) + CRITERIA.filter(c=>state.critMin[c]>0).length}`:''}</button>
        ${filterPanel()}
      </div>
      <div class="navlinks">
        <a class="btn ghost" href="#/admin">Thêm dữ liệu</a>
        <a class="btn ghost" href="#/settings">Cài đặt</a>
      </div>
    </div>
  </div>`;
}

function filterPanel(){
  const opts = [
    {v:'crit1', l:`Điểm "${CRITERIA[0]}" cao nhất`},
    {v:'overall', l:'Điểm tổng cao nhất'},
    {v:'actorscore', l:'Điểm diễn viên cao nhất'},
    {v:'newest', l:'Mới cập nhật'},
  ];
  return `<div class="filter-panel ${state.filterOpen?'open':''}" id="filterPanel">
    <h4>Sắp xếp theo <span class="hint">(chọn 1)</span></h4>
    <div class="chip-row">
      ${opts.map(o=>`
        <label class="chip ${state.sort===o.v?'active':''}">
          <input type="checkbox" data-sort="${o.v}" ${state.sort===o.v?'checked':''}>
          ${o.l}
        </label>`).join('')}
    </div>

    ${actors.length ? `
    <h4>Diễn viên <span class="hint">(chọn nhiều)</span></h4>
    <div class="chip-row" style="max-height:160px;overflow-y:auto;">
      ${actors.map(a=>`
        <label class="chip ${state.filterActorIds.includes(a.id)?'active':''}">
          <input type="checkbox" data-filter-actor="${a.id}" ${state.filterActorIds.includes(a.id)?'checked':''}>
          ${esc(a.name)}
        </label>`).join('')}
    </div>` : ''}

    <h4>Điểm tổng tối thiểu</h4>
    <div class="slider-row" style="margin-bottom:14px;">
      <input type="range" min="0" max="100" value="${state.overallMin}" id="overallMinSlider">
      <span class="slider-val" id="overallMinVal">${state.overallMin}</span>
    </div>

    <h4>Ngưỡng điểm từng tiêu chí</h4>
    ${CRITERIA.map(c=>`
      <div class="slider-row" style="margin-bottom:10px;">
        <span style="width:120px;flex:none;font-size:13px;color:var(--muted);">${esc(c)}</span>
        <input type="range" min="0" max="100" value="${state.critMin[c]}" data-crit-min="${esc(c)}">
        <span class="slider-val" id="critmin-val-${esc(c)}" style="width:30px;font-size:14px;">${state.critMin[c]}</span>
      </div>`).join('')}

    <div class="filter-actions"><button class="btn ghost" id="clearFilter">Xóa lọc</button></div>
  </div>`;
}

/* ============================================================
   HOME PAGE
   ============================================================ */
function homePage(){
  if(loadError) return `<div class="banner" style="margin-top:30px;white-space:pre-line;">${esc(loadError)}</div>`;
  if(!dataReady) return loadingBlock();
  const list = filteredSortedReviews();
  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if(state.page > totalPages) state.page = totalPages;
  const pageItems = list.slice((state.page-1)*PAGE_SIZE, state.page*PAGE_SIZE);

  return `
    <div class="page-head">
      <h1>Thư viện đánh giá</h1>
      <p>Điểm hiển thị được tính theo thuật toán IRL — cân bằng theo độ hiếm của điểm cao trên từng tiêu chí.</p>
    </div>
    <p class="result-count">${list.length} kết quả</p>
    ${pageItems.length ? `<div class="grid">${pageItems.map(r=>reviewCard(r)).join('')}</div>` : emptyBlock('Chưa có đánh giá nào phù hợp','Thử đổi từ khóa tìm kiếm hoặc bộ lọc.')}
    ${pager(totalPages)}
  `;
}

function applyCommonFilters(list, scores){
  if(state.filterActorIds.length){
    list = list.filter(r=> (r.actorIds||[]).some(id=> state.filterActorIds.includes(id)) );
  }
  CRITERIA.forEach(c=>{
    const min = state.critMin[c];
    if(min>0) list = list.filter(r=> ((r.scores||{})[c]||0) >= min );
  });
  if(state.overallMin>0){
    list = list.filter(r=> (scores[r.id]?.overall||0) >= state.overallMin );
  }
  return list;
}

function filteredSortedReviews(){
  const scores = computeReviewScores();
  const actorScores = computeActorScores();
  let list = reviews.slice();

  const q = normalize(state.search);
  if(q){
    list = list.filter(r=>{
      if(normalize(r.title).includes(q)) return true;
      return (r.actorIds||[]).some(id=>{
        const a = actorById(id);
        return a && normalize(a.name).includes(q);
      });
    });
  }

  list = applyCommonFilters(list, scores);

  if(state.sort === 'crit1'){
    list.sort((a,b)=> ((b.scores||{})[CRITERIA[0]]||0) - ((a.scores||{})[CRITERIA[0]]||0) );
  } else if(state.sort === 'overall'){
    list.sort((a,b)=> (scores[b.id]?.overall||0) - (scores[a.id]?.overall||0) );
  } else if(state.sort === 'actorscore'){
    const maxActorScore = r => Math.max(0, ...(r.actorIds||[]).map(id=>actorScores[id]||0));
    list.sort((a,b)=> maxActorScore(b) - maxActorScore(a));
  } else {
    list.sort((a,b)=> (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0) );
  }
  return list;
}

function reviewCard(r){
  const scores = computeReviewScores();
  const overall = scores[r.id]?.overall || 0;
  const actorList = (r.actorIds||[]).map(id=>actorById(id)).filter(Boolean);
  return `
  <a class="card" href="#/review/${r.id}">
    <div class="card-media">
      <img src="${esc(r.imageUrl)}" alt="${esc(r.title)}" loading="lazy" onerror="this.style.opacity=0.2">
      <div class="score-badge">${fmt(overall)}<small>/100</small></div>
    </div>
    <div class="card-body">
      <h3 class="card-title">${esc(r.title)}</h3>
      <div class="crit-list">
        ${CRITERIA.map(c=>{
          const v = (r.scores||{})[c]||0;
          return `<div class="crit-row"><span class="label">${esc(c)}</span><span class="crit-bar"><i style="width:${v}%"></i></span><span class="crit-val">${fmt(v)}</span></div>`;
        }).join('')}
      </div>
      ${actorList.length ? `<div class="actor-row">
        ${actorList.map(a=>`
          <span class="actor-chip" onclick="event.preventDefault();event.stopPropagation();go('#/actor/${a.id}')">
            <img src="${esc(a.avatarUrl)}" alt="" onerror="this.style.opacity=0.2">
            ${esc(a.name)}
          </span>`).join('')}
      </div>` : ''}
    </div>
  </a>`;
}

function pager(totalPages){
  if(totalPages<=1) return '';
  let btns = '';
  for(let i=1;i<=totalPages;i++){
    if(i===1 || i===totalPages || Math.abs(i-state.page)<=1){
      btns += `<button data-page="${i}" class="${i===state.page?'active':''}">${i}</button>`;
    } else if(Math.abs(i-state.page)===2){
      btns += `<span class="dots">…</span>`;
    }
  }
  return `<div class="pager">
    <button data-page="${state.page-1}" ${state.page===1?'disabled':''}>${icon('back')}</button>
    ${btns}
    <button data-page="${state.page+1}" ${state.page===totalPages?'disabled':''}>›</button>
  </div>`;
}

/* ============================================================
   REVIEW DETAIL PAGE
   ============================================================ */
function reviewPage(id){
  if(!dataReady) return loadingBlock();
  const r = reviews.find(x=>x.id===id);
  if(!r) return emptyBlock('Không tìm thấy đánh giá này','Có thể nó đã bị xóa.');
  const scores = computeReviewScores();
  const info = scores[r.id] || {overall:0, perCrit:{}};
  const actorList = (r.actorIds||[]).map(aid=>actorById(aid)).filter(Boolean);

  return `
  <div class="detail-review">
    <div>
      <div class="detail-img"><img src="${esc(r.imageUrl)}" alt="${esc(r.title)}" onerror="this.style.opacity=0.2"></div>
    </div>
    <div>
      <h1 class="detail-title">${esc(r.title)}</h1>
      <div class="detail-actors">
        ${actorList.map(a=>`
          <span class="actor-chip" onclick="go('#/actor/${a.id}')" style="cursor:pointer;">
            <img src="${esc(a.avatarUrl)}" alt="" onerror="this.style.opacity=0.2">
            ${esc(a.name)}
          </span>`).join('') || '<span class="hint">Chưa gán diễn viên</span>'}
      </div>
      <div class="big-score">
        <span class="num">${fmt(info.overall)}</span>
        <span class="cap">/ 100 — điểm sau khi tính IRL</span>
      </div>
      <div class="crit-detail">
        ${CRITERIA.map(c=>{
          const v = (r.scores||{})[c]||0;
          return `<div class="crit-detail-row">
            <div class="top"><span>${esc(c)}</span><b>${fmt(v)}</b></div>
            <div class="crit-detail-bar"><i style="width:${v}%"></i></div>
          </div>`;
        }).join('')}
      </div>
      <p class="note">Điểm tổng được tính theo trọng số hiếm: tiêu chí mà đa số video/diễn viên đều đạt cao sẽ đóng góp ít hơn vào điểm tổng; tiêu chí ít video đạt điểm cao sẽ đóng góp nhiều hơn nếu video này đạt cao ở đó.</p>
    </div>
  </div>`;
}

/* ============================================================
   ACTOR DETAIL PAGE
   ============================================================ */
function actorPage(id){
  if(!dataReady) return loadingBlock();
  const a = actorById(id);
  if(!a) return emptyBlock('Không tìm thấy diễn viên này','Có thể hồ sơ đã bị xóa.');
  const actorScores = computeActorScores();
  const myScore = actorScores[a.id]||0;
  let list = reviews.filter(r=>(r.actorIds||[]).includes(a.id));

  const q = normalize(state.search);
  if(q) list = list.filter(r=>normalize(r.title).includes(q));

  const scores = computeReviewScores();
  list = applyCommonFilters(list, scores);
  if(state.sort === 'crit1'){
    list.sort((x,y)=>((y.scores||{})[CRITERIA[0]]||0)-((x.scores||{})[CRITERIA[0]]||0));
  } else if(state.sort === 'overall' || state.sort === 'actorscore'){
    list.sort((x,y)=>(scores[y.id]?.overall||0)-(scores[x.id]?.overall||0));
  } else {
    list.sort((x,y)=>(y.createdAt?.seconds||0)-(x.createdAt?.seconds||0));
  }

  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if(state.page > totalPages) state.page = totalPages;
  const pageItems = list.slice((state.page-1)*PAGE_SIZE, state.page*PAGE_SIZE);

  return `
    <div class="actor-head">
      <img src="${esc(a.avatarUrl)}" alt="${esc(a.name)}" onerror="this.style.opacity=0.2">
      <div>
        <h1>${esc(a.name)}</h1>
        <div class="sub">Điểm diễn viên (IRL): <b style="color:var(--accent)">${fmt(myScore)}</b>/100 · ${list.length} video</div>
      </div>
    </div>
    ${pageItems.length ? `<div class="grid">${pageItems.map(r=>reviewCard(r)).join('')}</div>` : emptyBlock('Chưa có video nào','Diễn viên này chưa xuất hiện trong đánh giá nào phù hợp bộ lọc.')}
    ${pager(totalPages)}
  `;
}

/* ============================================================
   ADMIN PAGE
   ============================================================ */
let draftActorIds = [];
let draftScores = {}; CRITERIA.forEach(c=>draftScores[c]=50);

function adminPage(){
  return `
  <div class="form-shell">
    <h1 class="serif" style="font-size:28px;margin-bottom:4px;">Thêm dữ liệu</h1>
    <p class="hint" style="margin-bottom:20px;">Dữ liệu được lưu trực tiếp vào Firebase của bạn.</p>
    <div class="tabs">
      <a class="tab ${state.adminTab==='actor'?'active':''}" href="javascript:void(0)" data-tab="actor">Diễn viên</a>
      <a class="tab ${state.adminTab==='review'?'active':''}" href="javascript:void(0)" data-tab="review">Đánh giá video</a>
    </div>
    ${state.adminTab==='actor' ? actorForm() : reviewForm()}
  </div>`;
}

function actorForm(){
  return `
  <form id="actorForm">
    <label>Tên diễn viên</label>
    <input type="text" name="name" required placeholder="Ví dụ: Nguyễn A">
    <label>URL ảnh đại diện</label>
    <input type="url" name="avatarUrl" required placeholder="https://…">
    <div class="form-actions"><button class="btn primary" type="submit">Lưu diễn viên</button></div>
  </form>`;
}

function reviewForm(){
  return `
  <form id="reviewForm">
    <label>Tiêu đề video</label>
    <input type="text" name="title" required placeholder="Tên video">
    <label>URL ảnh (nhúng)</label>
    <input type="url" name="imageUrl" required placeholder="https://…">
    <label>Diễn viên trong video</label>
    <div class="actor-pick">
      ${actors.length ? actors.map(a=>`<span class="pick-chip ${draftActorIds.includes(a.id)?'active':''}" data-actor="${a.id}">${esc(a.name)}</span>`).join('') : '<span class="hint">Chưa có diễn viên nào — hãy thêm ở tab "Diễn viên" trước.</span>'}
    </div>
    <label style="margin-top:26px;">Tiêu chí đánh giá</label>
    ${CRITERIA.map(c=>`
      <div class="slider-row" style="margin-top:10px;">
        <span style="width:150px;flex:none;">${esc(c)}</span>
        <input type="range" min="0" max="100" value="${draftScores[c]}" data-crit="${esc(c)}">
        <span class="slider-val" id="val-${esc(c)}">${draftScores[c]}</span>
      </div>`).join('')}
    <div class="form-actions"><button class="btn primary" type="submit">Lưu đánh giá</button></div>
  </form>`;
}

/* ============================================================
   SETTINGS PAGE
   ============================================================ */
function settingsPage(required){
  const cfg = loadConfig();
  return `
  <div class="form-shell">
    <h1 class="serif" style="font-size:28px;margin-bottom:4px;">Cài đặt Firebase</h1>
    <p class="hint" style="margin-bottom:20px;">Dán cấu hình Firebase (Project settings → SDK config) của dự án Firestore bạn muốn dùng để lưu dữ liệu.</p>
    ${required ? `<div class="banner">Cần cấu hình Firebase trước khi sử dụng trang này.</div>` : ''}
    <form id="settingsForm">
      <label>Firebase config (dạng JSON)</label>
      <textarea name="config" placeholder='{"apiKey":"...","authDomain":"...","projectId":"...","storageBucket":"...","messagingSenderId":"...","appId":"..."}'>${cfg?esc(JSON.stringify(cfg,null,2)):''}</textarea>
      <p class="hint">Bật Cloud Firestore ở chế độ "test mode" (hoặc rule phù hợp) trong Firebase Console để trang này đọc/ghi được. App này chỉ đọc/ghi 2 collection riêng: <code>${COLL_ACTORS}</code> và <code>${COLL_REVIEWS}</code> — không đụng tới dữ liệu khác trong project.</p>
      <div class="form-actions"><button class="btn primary" type="submit">Lưu & kết nối</button></div>
    </form>
  </div>`;
}

/* ============================================================
   SHARED BLOCKS
   ============================================================ */
function loadingBlock(){ return `<div class="empty"><h3>Đang tải dữ liệu…</h3></div>`; }
function emptyBlock(title, sub){ return `<div class="empty"><h3 class="serif">${esc(title)}</h3><p>${esc(sub)}</p></div>`; }

/* ============================================================
   BINDINGS
   ============================================================ */
function bindGlobal(){
  const s = document.getElementById('searchInput');
  if(s){
    s.addEventListener('input', e=>{ state.search = e.target.value; state.page = 1; renderBodyOnly(); });
  }
  const ft = document.getElementById('filterToggle');
  if(ft){ ft.addEventListener('click', e=>{ e.stopPropagation(); state.filterOpen = !state.filterOpen; render(); }); }
  document.querySelectorAll('[data-sort]').forEach(el=>{
    el.addEventListener('change', ()=>{ state.sort = el.getAttribute('data-sort'); state.page=1; state.filterOpen=true; render(); });
  });
  document.querySelectorAll('[data-filter-actor]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const id = el.getAttribute('data-filter-actor');
      if(state.filterActorIds.includes(id)) state.filterActorIds = state.filterActorIds.filter(x=>x!==id);
      else state.filterActorIds.push(id);
      state.page = 1; state.filterOpen = true; render();
    });
  });
  const overallSlider = document.getElementById('overallMinSlider');
  if(overallSlider){
    overallSlider.addEventListener('input', ()=>{
      state.overallMin = parseInt(overallSlider.value);
      document.getElementById('overallMinVal').textContent = overallSlider.value;
    });
    overallSlider.addEventListener('change', ()=>{ state.page=1; render(); });
  }
  document.querySelectorAll('[data-crit-min]').forEach(sl=>{
    sl.addEventListener('input', ()=>{
      const c = sl.getAttribute('data-crit-min');
      state.critMin[c] = parseInt(sl.value);
      document.getElementById('critmin-val-'+c).textContent = sl.value;
    });
    sl.addEventListener('change', ()=>{ state.page=1; render(); });
  });
  const cf = document.getElementById('clearFilter');
  if(cf){ cf.addEventListener('click', ()=>{ state.sort='newest'; resetFilters(); state.filterOpen=false; render(); }); }
  document.addEventListener('click', closeFilterOutside);

  document.querySelectorAll('.pager [data-page]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.page = parseInt(b.getAttribute('data-page')); render(); window.scrollTo({top:0,behavior:'smooth'}); });
  });

  document.querySelectorAll('.tab[data-tab]').forEach(t=>{
    t.addEventListener('click', ()=>{ state.adminTab = t.getAttribute('data-tab'); render(); });
  });

  const af = document.getElementById('actorForm');
  if(af){ af.addEventListener('submit', onActorSubmit); }

  const rf = document.getElementById('reviewForm');
  if(rf){
    rf.addEventListener('submit', onReviewSubmit);
    document.querySelectorAll('.pick-chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        const id = chip.getAttribute('data-actor');
        if(draftActorIds.includes(id)) draftActorIds = draftActorIds.filter(x=>x!==id);
        else draftActorIds.push(id);
        render();
      });
    });
    document.querySelectorAll('[data-crit]').forEach(sl=>{
      sl.addEventListener('input', ()=>{
        const c = sl.getAttribute('data-crit');
        draftScores[c] = parseInt(sl.value);
        document.getElementById('val-'+c).textContent = sl.value;
      });
    });
  }

  const sf = document.getElementById('settingsForm');
  if(sf){ sf.addEventListener('submit', onSettingsSubmit); }
}

function closeFilterOutside(e){
  const panel = document.getElementById('filterPanel');
  const toggle = document.getElementById('filterToggle');
  if(!panel || !state.filterOpen) return;
  if(panel.contains(e.target) || (toggle && toggle.contains(e.target))) return;
  state.filterOpen = false; render();
}

function renderBodyOnly(){ render(); }

function onActorSubmit(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const name = fd.get('name').trim(), avatarUrl = fd.get('avatarUrl').trim();
  if(!name || !avatarUrl) return;
  db.collection(COLL_ACTORS).add({name, avatarUrl, createdAt: firebase.firestore.FieldValue.serverTimestamp()})
    .then(()=>{ e.target.reset(); alert('Đã lưu diễn viên.'); })
    .catch(err=>alert(friendlyError(err)));
}

function onReviewSubmit(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const title = fd.get('title').trim(), imageUrl = fd.get('imageUrl').trim();
  if(!title || !imageUrl) return;
  db.collection(COLL_REVIEWS).add({
    title, imageUrl,
    actorIds: draftActorIds.slice(),
    scores: {...draftScores},
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(()=>{
    e.target.reset();
    draftActorIds = [];
    CRITERIA.forEach(c=>draftScores[c]=50);
    alert('Đã lưu đánh giá.');
    render();
  }).catch(err=>alert(friendlyError(err)));
}

function onSettingsSubmit(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  let cfg;
  try{ cfg = JSON.parse(fd.get('config')); }
  catch(err){ alert('JSON không hợp lệ.'); return; }
  saveConfig(cfg);
  location.hash = '#/';
  location.reload();
}
</script>
